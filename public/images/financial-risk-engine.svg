  <text x="200" y="88" fill="#F5F2EA" font-family="Arial, sans-serif" font-size="26" font-weight="800">Financial Risk Engine</text>
  <text x="200" y="107" fill="#A8A29E" font-family="Arial, sans-serif" font-size="7">Institutional Portfolio Risk Simulator - Monte Carlo simulation, stress testing, risk attribution, and portfolio optimization.</text>
  <text x="200" y="132" fill="#F5F2EA" font-family="Arial, sans-serif" font-size="8" font-weight="700">This dashboard simulates portfolio risk under uncertainty using correlated Monte Carlo return paths, scenario stress</text>
  <text x="200" y="146" fill="#F5F2EA" font-family="Arial, sans-serif" font-size="8" font-weight="700">testing, asset-level risk attribution, and mean-variance optimization.</text>
  <text x="200" y="182" fill="#F5F2EA" font-family="Arial, sans-serif" font-size="21" font-weight="800">Portfolio Setup</text>
  <text x="200" y="204" fill="#F5F2EA" font-family="Arial, sans-serif" font-size="8" font-weight="700">Primary scenario:</text>
  <text x="272" y="204" fill="#28D17C" font-family="Arial, sans-serif" font-size="8">market_crash</text>
  <text x="329" y="204" fill="#F5F2EA" font-family="Arial, sans-serif" font-size="8">- Broad market selloff, higher volatility, higher correlations.</text>
  <line x1="200" y1="232" x2="611" y2="232" stroke="#27272A"/>

